name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Smoke (loader jalan tanpa .env)
        run: node --input-type=module -e "await import('./src/diff.js'); await import('./src/prompt.js'); await import('./src/review.js'); console.log('modules ok')"
      - name: Unit tests
        run: node test.js
